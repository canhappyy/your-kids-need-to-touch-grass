[project]
name = "playgo-ai-recommendation"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "ml-dtypes==0.5.1",
  "numpy>=1.26,<2",
  "onnx==1.17.0",
  "onnxruntime==1.18.1",
  "optimum[onnxruntime]>=2.0,<3",
  "sentence-transformers>=5.1,<6",
  "torch>=2.2,<3",
]

[dependency-groups]
dev = [
  "pandas>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "pytest>=8.4,<9",
  "python-dotenv>=1.0,<2",
  "sqlalchemy>=2.0,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = [
  "handler.py",
  "ranker.py",
  "recommendation_functions.py",
  "recommendation_pipeline.py",
  "build_tag_index.py",
  "download_models.py",
  "__init__.py",
  "cache",
]

[tool.hatch.build.targets.wheel]
only-include = [
  "handler.py",
  "ranker.py",
  "recommendation_functions.py",
  "recommendation_pipeline.py",
  "build_tag_index.py",
  "download_models.py",
  "__init__.py",
  "cache",
]


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

